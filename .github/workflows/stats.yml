# Holt die Stats per FTP von G-Portal, baut die Seite und lädt sie auf deinen Webspace (eigene Domain).
# GitHub Pages wird NICHT benutzt – die Seite ist nur über deine eigene Domain erreichbar.
# Zugangsdaten kommen aus den Repository-Secrets (Settings → Secrets and variables → Actions).
name: Stats aktualisieren

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # Namens-Cache und Dateistand vom letzten Lauf wiederverwenden (spart Downloads)
      - uses: actions/cache@v5
        with:
          path: |
            mirror
            names-cache.json
          key: mcstats-${{ github.run_id }}
          restore-keys: mcstats-

      - name: SFTP-Bibliothek installieren (nur bei SFTP nötig)
        env:
          FTP_PROTOCOL: ${{ secrets.FTP_PROTOCOL }}
          WEB_FTP_PROTOCOL: ${{ secrets.WEB_FTP_PROTOCOL }}
        run: |
          if [ "${FTP_PROTOCOL,,}" = "sftp" ] || [ "${WEB_FTP_PROTOCOL,,}" = "sftp" ]; then
            npm install ssh2-sftp-client
          fi

      - name: Stats holen und Seite bauen
        env:
          SERVER_NAME: ${{ vars.SERVER_NAME }}
          FTP_PROTOCOL: ${{ secrets.FTP_PROTOCOL }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
          STATS_PATH: ${{ vars.STATS_PATH || '/New World (4)/players/stats' }}
          MC_HOST: ${{ secrets.MC_HOST }}
          MC_PORT: ${{ secrets.MC_PORT }}
          HIDDEN_PLAYERS: ${{ vars.HIDDEN_PLAYERS }}
        run: node build.js

      - name: Auf eigene Domain hochladen
        env:
          WEB_FTP_PROTOCOL: ${{ secrets.WEB_FTP_PROTOCOL }}
          WEB_FTP_HOST: ${{ secrets.WEB_FTP_HOST }}
          WEB_FTP_PORT: ${{ secrets.WEB_FTP_PORT }}
          WEB_FTP_USER: ${{ secrets.WEB_FTP_USER }}
          WEB_FTP_PASSWORD: ${{ secrets.WEB_FTP_PASSWORD }}
          WEB_FTP_PATH: ${{ secrets.WEB_FTP_PATH }}
        run: node deploy.js
